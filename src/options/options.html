<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Чайная — настройки</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>🍵 Чайная</h1>

    <section>
      <h2>Фразы</h2>
      <label class="row">
        <span>Набор фраз</span>
        <select id="pack"></select>
      </label>
      <p id="pack-hint" class="hint"></p>
      <label class="row">
        <span>Голос набора</span>
        <select id="voice"></select>
      </label>
      <p id="voice-hint" class="hint"></p>
      <label class="row">
        <span>Обращаться по имени</span>
        <input id="name" type="text" placeholder="пусто — без имени" maxlength="24">
      </label>
      <p class="hint">Имя подставляется в те фразы, где оно уместно.</p>
      <p id="sample" class="sample"></p>
    </section>

    <section>
      <h2>Сигналы</h2>
      <label class="row"><span>Гонг в конце шага</span><input id="sound" type="checkbox"></label>
      <label class="row"><span>Тики на последних 3 секундах</span><input id="ticks" type="checkbox"></label>
      <label class="row">
        <span>Громкость</span>
        <input id="volumeLevel" type="range" min="0" max="1" step="0.05">
      </label>
      <label class="row"><span>Системные уведомления</span><input id="notifications" type="checkbox"></label>
      <button id="test" class="ghost">Проверить гонг</button>
    </section>

    <section>
      <h2>Озвучка</h2>
      <label class="row"><span>Проговаривать фразу голосом</span><input id="speech" type="checkbox"></label>
      <p class="hint">
        Пророк Санбой говорит записанным голосом, остальные наборы — системным синтезом речи.
      </p>
      <label class="row">
        <span>Громкость озвучки</span>
        <input id="speechVolume" type="range" min="0" max="1" step="0.05">
      </label>
      <label class="row">
        <span>Скорость речи</span>
        <input id="speechRate" type="range" min="0.6" max="1.6" step="0.05">
      </label>
      <p id="voices" class="hint"></p>
      <button id="test-voice" class="ghost">Проверить голос</button>
    </section>

    <section>
      <h2>Заварка</h2>
      <label class="row">
        <span>Объём посуды по умолчанию</span>
        <select id="defaultVolume"></select>
      </label>
      <p class="hint">Следующий пролив запускается кнопкой — таймер сам вперёд не бежит.</p>
    </section>

    <section>
      <h2>Данные</h2>
      <button id="reset-session" class="ghost">Сбросить текущую заварку</button>
      <button id="reset-all" class="ghost danger">Очистить всё (избранное и настройки)</button>
    </section>

    <p id="saved" class="saved" hidden>Сохранено</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
